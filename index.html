function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ym(d){return d.slice(0,7)}
function rp(n){return "Rp "+Math.round(n).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(list,t){return list.filter(function(x){return x.type===t}).reduce(function(a,x){return a+x.amount},0)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1400)}
function nid(){return Date.now()+Math.floor(Math.random()*1000)}
function topObj(id){return S.tops.find(function(x){return x.id==id})}
function unit(l){return l.price+l.tops.reduce(function(a,id){var p=topObj(id);return a+(p?p.price:0)},0)}
function lineTotal(l){return unit(l)*l.qty}
function cartTotal(){return pos.cart.reduce(function(a,l){return a+lineTotal(l)},0)}
function lineName(l){var n=l.tops.map(function(id){var p=topObj(id);return p?p.name:""}).filter(Boolean);return l.qty+"x "+l.name+(n.length?" +"+n.join(","):"")}
function stats(list){var i=sum(list,"in"),o=sum(list.filter(function(x){return x.cat!=="Peralatan"}),"out"),p=i-o;return '<div class="grid"><div class="stat"><small>Pemasukan</small><b class="in">'+rp(i)+'</b></div><div class="stat"><small>Pengeluaran</small><b class="out">'+rp(o)+'</b></div><div class="stat"><small>Laba</small><b class="'+(p>=0?"in":"out")+'">'+rp(p)+'</b></div></div>'}
var cf="";
var pr={mode:"month",ref:today()};
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)}
function wkStart(s){var d=new Date(s+"T00:00:00");return addDays(s,-((d.getDay()+6)%7))}
function range(){var r=pr.ref;if(pr.mode==="all")return["0000-01-01","9999-12-31"];if(pr.mode==="day")return[r,r];if(pr.mode==="week"){var s=wkStart(r);return[s,addDays(s,6)]}return[r.slice(0,7)+"-01",r.slice(0,7)+"-31"]}
function dl(s,op){return new Date(s+"T00:00:00").toLocaleDateString("id-ID",op||{day:"numeric",month:"short",year:"numeric"})}
function rlabel(){var r=pr.ref;if(pr.mode==="all")return"Semua periode";if(pr.mode==="day")return dl(r,{weekday:"long",day:"numeric",month:"long",year:"numeric"});if(pr.mode==="week"){var g=range();return dl(g[0])+" - "+dl(g[1])}return dl(r,{month:"long",year:"numeric"})}
function stepRef(n){var r=pr.ref;if(pr.mode==="day")return addDays(r,n);if(pr.mode==="week")return addDays(r,7*n);var d=new Date(r+"T00:00:00");d.setDate(1);d.setMonth(d.getMonth()+n);return fmt(d)}
function rangeUI(){var M=[["day","Harian"],["week","Mingguan"],["month","Bulanan"],["all","Semua"]];var h='<div class="seg">'+M.map(function(x){return '<button data-rm="'+x[0]+'" class="'+(pr.mode===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>';if(pr.mode!=="all")h+='<div class="row" style="border:0;padding-bottom:0"><button class="btn sm" data-rs="-1" style="color:var(--tx)">&lsaquo;</button><b style="text-align:center;flex:1">'+rlabel()+'</b><button class="btn sm" data-rs="1" style="color:var(--tx)">&rsaquo;</button></div><input type="date" id="r-date" value="'+pr.ref+'">';return h+'<button class="btn" id="pdf" style="margin-top:12px">Unduh PDF laporan ini</button>'}
function recap(list,kf,title,lf){var m={};list.forEach(function(x){var k=kf(x.date),o=m[k]||(m[k]={i:0,o:0});if(x.type==="in")o.i+=x.amount;if(x.type==="out"&&x.cat!=="Peralatan")o.o+=x.amount});var ks=Object.keys(m).sort().reverse();if(!ks.length)return"";return '<div class="card"><h2>'+title+'</h2>'+ks.map(function(k){var o=m[k],p=o.i-o.o;return '<div class="row"><div class="l"><b>'+lf(k)+'</b><small>Masuk '+rp(o.i)+' · Keluar '+rp(o.o)+'</small></div><b class="'+(p>=0?"in":"out")+'">'+rp(p)+'</b></div>'}).join("")+'</div>'}
function recaps(list){var id=function(s){return s},day=function(k){return dl(k,{weekday:"short",day:"numeric",month:"short"})},wk=function(k){return dl(k)+" - "+dl(addDays(k,6))},mo=function(k){return dl(k+"-01",{month:"long",year:"numeric"})};if(pr.mode==="day")return"";if(pr.mode==="week")return recap(list,id,"Rekap per hari",day);if(pr.mode==="month")return recap(list,wkStart,"Rekap per minggu",wk)+recap(list,id,"Rekap per hari",day);return recap(list,function(s){return s.slice(0,7)},"Rekap per bulan",mo)}
function report(list){
var ins=list.filter(function(x){return x.type==="in"}),qrs=ins.filter(function(x){return x.pay==="qr"}),css=ins.filter(function(x){return x.pay!=="qr"});
var qr=sum(qrs,"in"),cash=sum(css,"in"),inc=qr+cash,exp=sum(list,"out"),eq=sum(list.filter(function(x){return x.cat==="Peralatan"}),"out"),mod=list.filter(function(x){return x.type==="cap"}).reduce(function(a,x){return a+x.amount},0),lab=inc-exp;
function r(a,b,c){return '<div class="row"><span>'+a+'</span><b class="'+(c||"")+'">'+b+'</b></div>'}
function hd(t){return '<small class="sub" style="display:block;margin:12px 0 0;font-weight:700">'+t+'</small>'}
var h='<div class="card"><h2>Laporan Keuangan</h2><small class="sub" style="display:block;margin:-6px 0 0">'+rlabel()+'</small>';
if(!list.length)return h+'<div class="empty">Belum ada data. Catat modal di tab Catat, lalu transaksi dan pengeluaran.</div></div>';
h+=hd("MODAL")+r("Setoran modal",rp(mod));

h+=hd("PENDAPATAN")+r("Cash ("+css.length+" transaksi)",rp(cash))+r("QR ("+qrs.length+" transaksi)",rp(qr))+r("Total pendapatan",rp(inc),"in");
h+=hd("PENGELUARAN")+r("Biaya operasional (bahan, gaji, dll)",rp(exp-eq),"out")+r("Peralatan / investasi",rp(eq),"out");
var op=inc-(exp-eq);h+=hd("HASIL USAHA")+r(op>=0?"Laba usaha":"Rugi usaha",rp(Math.abs(op)),op>=0?"in":"out");
if(exp>0)h+=r("Balik modal",Math.min(100,Math.round(inc/exp*100))+"% "+(lab>=0?"(sudah balik modal)":"(kurang "+rp(-lab)+")"));
h+=hd("POSISI KAS AKHIR")+r("Uang tunai",rp(mod+cash-exp))+r("Saldo QR",rp(qr))+r("Total kas",rp(mod+lab),mod+lab>=0?"in":"out");
return h+'<small class="sub" style="display:block;margin-top:10px">Balik modal = pendapatan sudah menutup semua uang yang keluar (bahan, biaya, dan peralatan). Pengeluaran dianggap dibayar tunai. Pilih Semua untuk laporan akhir lengkap.</small></div>'}
function txRow(x){return '<div class="row"><div class="l"><b>'+esc(x.desc)+'</b><small>'+x.date+' · '+esc(x.cat)+(x.type==="in"&&x.cat==="Penjualan"?' · '+(x.pay==="qr"?"QR":"Cash"):"")+'</small></div><div style="text-align:right;flex:none"><b class="'+(x.type==="out"?"out":"in")+'">'+(x.type==="out"?"-":"+")+rp(x.amount)+'</b><br><button class="btn sm" data-del="'+x.id+'"'+(cf==="t"+x.id?' style="background:#d62d20;color:#fff;border-color:#d62d20"':'')+'>'+(cf==="t"+x.id?"Yakin hapus?":"Hapus")+'</button></div></div>'}

    var ty=document.querySelector("input[name=type]:checked").value;S.tx.push({id:nid(),date:document.getElementById("f-date").value||today(),type:ty,desc:desc,amount:amt,cat:ty==="cap"?"Modal":document.getElementById("f-cat").value});
    save();tab="home";render();toast("Tersimpan")
  }else if(b.id==="m-save"){if(ro())return;
    var n=document.getElementById("m-name").value.trim(),pr=Number(document.getElementById("m-price").value);
    if(!n||!(pr>0)){toast("Isi nama dan harga");return}
    S.menu.push({id:nid(),name:n,price:pr,group:document.getElementById("m-grp").value});save();render();toast("Menu ditambah")
  }else if(b.id==="t-save"){if(ro())return;
    var tn=document.getElementById("t-name").value.trim(),tpz=Number(document.getElementById("t-price").value);
    if(!tn||!(tpz>=0)){toast("Isi nama topping");return}
    S.tops.push({id:nid(),name:tn,price:tpz||0,group:document.getElementById("t-grp").value});save();render();toast("Topping ditambah")
  }
});
document.addEventListener("input",function(e){if(e.target.id==="q-menu"){pos.q=e.target.value;ovlList()}});
document.addEventListener("change",function(e){if(e.target.id==="r-date"&&e.target.value){pr.ref=e.target.value;render()}});
boot();
</script>
